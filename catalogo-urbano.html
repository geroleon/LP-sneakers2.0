<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Urbano & Casual — LP Sneakers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --ink: #14120F;
    --paper: #F1ECE1;
    --paper-2: #E7E0D0;
    --orange: #FF4712;
    --grey: #8A8375;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  a{ color: inherit; text-decoration:none; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  h1, h2, h3{
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  .wrap{ max-width: 1180px; margin:0 auto; padding: 0 28px; }

  /* ---------- HEADER (igual al del sitio) ---------- */
  header{
    position: sticky;
    top:0;
    background: var(--paper);
    border-bottom: 1.5px solid var(--ink);
  }
  .nav-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    height: 76px;
  }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-mark{
    width:38px; height:38px;
    background: var(--ink);
    color: var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'Archivo Black', sans-serif;
    font-size: 1rem;
    border-radius: 3px;
  }
  .logo-word{ font-family:'Archivo Black', sans-serif; font-size: 1.05rem; }
  .logo-word span{ color: var(--orange); }
  .back-link{
    font-size: 0.9rem;
    font-weight: 500;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 10px 18px;
  }
  .back-link:hover{ border-color: var(--orange); color: var(--orange); }

  /* ---------- CONTENIDO ---------- */
  .cat-title{
    padding: 50px 0 10px;
  }
  .cat-title h1{ font-size: clamp(2rem, 4vw, 2.8rem); }
  .cat-title p{ color: var(--grey); margin-top: 8px; }

  .product-grid{
    padding: 40px 0 80px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .product-card{
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    overflow:hidden;
    background: var(--paper);
    display:flex;
    flex-direction:column;
  }
  .product-media{
    background: var(--paper-2);
    aspect-ratio: 1 / 1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .product-media img{
    width:100%;
    height:100%;
    object-fit: cover;
  }
  .product-info{
    padding: 16px;
    display:flex;
    flex-direction:column;
    gap: 4px;
  }
  .product-info h3{
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 1rem;
  }
  .ref{ font-size: 0.75rem; color: var(--grey); }
  .price{ font-size: 1.02rem; font-weight: 600; margin-top: 6px; }

  @media (max-width: 900px){
    .product-grid{ grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px){
    .product-grid{ grid-template-columns: 1fr; }
    nav ul{ display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav-row">
    <div class="logo">
      <div class="logo-mark"><img src="img/logo lp.jpg" alt="logo LP Sneakers" width="38" height="38"></div>
      <div class="logo-word">LP <span>Sneakers</span></div>
    </div>
    <a href="index.html" class="back-link">← Volver al inicio</a>
  </div>
</header>

<div class="wrap cat-title">
  <h1>Catálogo Urbano & Casual</h1>
  <p>Modelos disponibles seleccionados para esta categoría.</p>
</div>

<div class="wrap product-grid">

  <!-- ===== PRODUCTO 1 — reemplaza el archivo img/zapato-1.jpg por tu foto real ===== -->
  <div class="product-card">
    <div class="product-media">
      <img src="img/zapato-1.jpeg" alt="Nombre del zapato 1">
    </div>
    <div class="product-info">
      <h3>Air Force 1</h3>
      <span class="ref mono">Air Force 1</span>
      <span class="price">$159.000</span>
    </div>
  </div>

  <!-- ===== PRODUCTO 2 — reemplaza el archivo img/zapato-2.jpg por tu foto real ===== -->
  <div class="product-card">
    <div class="product-media">
      <img src="img/Chanclas-nike-3.png" alt="Nombre del zapato 2" height="" width="">
    </div>
    <div class="product-info">
      <h3>Nombre del zapato</h3>
      <span class="ref mono">REF. LP-0002</span>
      <span class="price">$149.000</span>
    </div>
  </div>

  <!-- ===== PRODUCTO 3 — reemplaza el archivo img/zapato-3.jpg por tu foto real ===== -->
  <div class="product-card">
    <div class="product-media">
      <img src="img/zapato-3.jpg" alt="Nombre del zapato 3">
    </div>
    <div class="product-info">
      <h3>Nombre del zapato</h3>
      <span class="ref mono">REF. LP-0003</span>
      <span class="price">$169.000</span>
    </div>
  </div>

  <!-- ===== PRODUCTO 4 — reemplaza el archivo img/zapato-4.jpg por tu foto real ===== -->
  <div class="product-card">
    <div class="product-media">
      <img src="img/zapato-4.jpg" alt="Nombre del zapato 4">
    </div>
    <div class="product-info">
      <h3>Nombre del zapato</h3>
      <span class="ref mono">REF. LP-0004</span>
      <span class="price">$179.000</span>
    </div>
  </div>

  <!-- Copia este bloque "product-card" completo por cada zapato que quieras añadir, cambiando el número del archivo (img/zapato-5.jpg, img/zapato-6.jpg...) -->

</div>

</body>
</html>
